name: package-preview

on:
  workflow_dispatch:
  push:
    tags:
      - "preview-*"
      - "v*"

jobs:
  package-macos:
    name: Package macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Make preview artifact
        run: npm run make

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: algo-platform-macos-${{ github.run_id }}
          path: out/make/**
          if-no-files-found: error

  package-windows:
    name: Package Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Copy checkout to short Windows path
        shell: pwsh
        run: |
          if (Test-Path C:/w) {
            Remove-Item -Recurse -Force C:/w
          }
          New-Item -ItemType Directory -Force C:/w | Out-Null
          robocopy "$env:GITHUB_WORKSPACE" C:/w /MIR /XD .git
          if ($LASTEXITCODE -gt 7) {
            exit $LASTEXITCODE
          }
          exit 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location C:/w
          npm ci

      - name: Generate Prisma Client
        shell: pwsh
        run: |
          Set-Location C:/w
          npx prisma generate

      - name: Lint
        shell: pwsh
        run: |
          Set-Location C:/w
          npm run lint

      - name: Typecheck
        shell: pwsh
        run: |
          Set-Location C:/w
          npm run typecheck

      - name: Make preview artifact
        shell: pwsh
        run: |
          Set-Location C:/w
          npm run make

      - name: Copy Windows artifacts back
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/out" | Out-Null
          Copy-Item -Recurse -Force C:/w/out/make "$env:GITHUB_WORKSPACE/out/make"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: algo-platform-windows-${{ github.run_id }}
          path: out/make/**
          if-no-files-found: error
