name: package-preview

on:
  workflow_dispatch:
  push:
    tags:
      - "preview-*"
      - "v*"

jobs:
  package-macos:
    name: Package macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Make preview artifact
        run: npm run make

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: algo-platform-macos-${{ github.run_id }}
          path: out/make/**
          if-no-files-found: error

  package-windows:
    name: Package Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Mount short Windows workspace path
        shell: pwsh
        run: subst W: "$env:GITHUB_WORKSPACE"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        working-directory: W:/
        run: npm ci

      - name: Generate Prisma Client
        working-directory: W:/
        run: npx prisma generate

      - name: Lint
        working-directory: W:/
        run: npm run lint

      - name: Typecheck
        working-directory: W:/
        run: npm run typecheck

      - name: Make preview artifact
        working-directory: W:/
        run: npm run make

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: algo-platform-windows-${{ github.run_id }}
          path: W:/out/make/**
          if-no-files-found: error
